[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "algoxray"
version = "0.2.0"
description = "A local counterexample and evidence-grounded debugging workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["hypothesis==6.170.17", "networkx==3.7", "fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4,<5"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
algoxray = "algoxray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
